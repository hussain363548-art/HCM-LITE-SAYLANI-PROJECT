      .glass-panel {
        background: rgba(255, 255, 255, 0.86);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid rgba(244, 114, 182, 0.24);

        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(244, 114, 182, 0.32);
        box-shadow: 0 20px 45px -15px rgba(236, 72, 153, 0.18), 0 4px 16px -4px rgba(0, 0, 0, 0.04);

        box-shadow: 0 0 25px rgba(236, 72, 153, 0.2);
      }

      /* Pulse Ring Animation in Pink */
      @keyframes rippleRingPink {
        0% { transform: scale(0.95); opacity: 0.75; }
        50% { transform: scale(1.08); opacity: 0.25; }
        100% { transform: scale(0.95); opacity: 0.75; }
      }

      .animate-ripple {
        animation: rippleRingPink 3.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      @keyframes orbFloat {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(6deg); }
      }

      .animate-orb {
        animation: orbFloat 5s ease-in-out infinite;
      }

        width: 6px;

      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }

        }

          border: none !important;

      function loadDatabase() {

        try {
          return JSON.parse(raw);
        } catch (e) {
          console.error('Database parse error:', e);
          return createEmptyDatabase();
        }
      }

      function saveDatabase(db) {
        localStorage.setItem(DB_KEY, JSON.stringify(db));
      }

          actorName,
          actorRole,
          action,

        db.auditLogs.unshift(log);

      function formatMoney(amount) {
        return '$' + Number(amount || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }

      function numberToWords(num) {
        const a = ['','One ','Two ','Three ','Four ','Five ','Six ','Seven ','Eight ','Nine ','Ten ','Eleven ','Twelve ','Thirteen ','Fourteen ','Fifteen ','Sixteen ','Seventeen ','Eighteen ','Nineteen '];
        const b = ['', '', 'Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
        const n = ('000000000' + Math.floor(num)).substr(-9).match(/^(\d{2})(\d{2})(\d{2})(\d{1})(\d{2})$/);
        if (!n) return '';
        let str = '';
        str += (n[1] != 0) ? (a[Number(n[1])] || b[n[1][0]] + ' ' + a[n[1][1]]) + 'Crore ' : '';
        str += (n[2] != 0) ? (a[Number(n[2])] || b[n[2][0]] + ' ' + a[n[2][1]]) + 'Lakh ' : '';
        str += (n[3] != 0) ? (a[Number(n[3])] || b[n[3][0]] + ' ' + a[n[3][1]]) + 'Thousand ' : '';
        str += (n[4] != 0) ? (a[Number(n[4])] || b[n[4][0]] + ' ' + a[n[4][1]]) + 'Hundred ' : '';
        str += (n[5] != 0) ? ((str != '') ? 'and ' : '') + (a[Number(n[5])] || b[n[5][0]] + ' ' + a[n[5][1]]) : '';
        return (str.trim() || 'Zero') + ' Dollars Only';
      }

          const savedSession = localStorage.getItem('HCM_SESSION');
          if (savedSession) {
            try {
              const parsed = JSON.parse(savedSession);
              const user = this.db.users.find(u => u.id === parsed.id);
              if (user) this.currentUser = user;
            } catch (e) {
              localStorage.removeItem('HCM_SESSION');
            }
          }

          this.updateClock();
          setInterval(() => this.updateClock(), 1000);
        },

        updateClock() {
          const now = new Date();
          this.currentTimeStr = now.toLocaleTimeString('en-US', { hour12: true });
          const clockEl = document.getElementById('authoritative-clock');
          if (clockEl) clockEl.textContent = this.currentTimeStr;
          const liveDurationEl = document.getElementById('live-worked-duration');
          if (liveDurationEl && this.currentUser && this.currentUser.employeeId) {
            const todayStr = new Date().toISOString().split('T')[0];
            const att = this.db.attendance.find(a => a.employeeId === this.currentUser.employeeId && a.date === todayStr);
            if (att && att.checkIn && !att.checkOut) {
              const [h, m] = att.checkIn.split(':').map(Number);
              const checkInDate = new Date();
              checkInDate.setHours(h, m, 0);
              const diffMs = Math.max(0, now - checkInDate);
              const diffH = Math.floor(diffMs / 3600000);
              const diffM = Math.floor((diffMs % 3600000) / 60000);
              const diffS = Math.floor((diffMs % 60000) / 1000);
              liveDurationEl.textContent = `${diffH}h ${diffM}m ${diffS}s`;
            }
          }
        },

        setTab(tab) {
          this.currentTab = tab;
          this.render();
        },

        openModal(modalName, data = null) {
          this.activeModal = modalName;
          this.modalData = data;
          this.render();
        },

        closeModal() {
          if (this.cameraStream) {
            this.cameraStream.getTracks().forEach(t => t.stop());
            this.cameraStream = null;
          }
          this.activeModal = null;
          this.modalData = null;
          this.render();
        },

        render() {
          renderApp();
        }
      };

      let threeScene = null;

      function init3DHero() {
        const container = document.getElementById('three-hero-container');
        if (!container) return;

        if (threeAnimId) {
          cancelAnimationFrame(threeAnimId);
          threeAnimId = null;
        }
        if (threeRenderer) {
          threeRenderer.dispose();
          threeRenderer = null;
        }
        container.innerHTML = '';

        if (typeof THREE === 'undefined') {
          container.innerHTML = '<div class="w-full h-full flex items-center justify-center text-pink-400 text-sm font-medium">3D Hologram Initializing...</div>';
          return;
        }

        const width = container.clientWidth || 480;
        const height = container.clientHeight || 520;

        const scene = new THREE.Scene();
        threeScene = scene;

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        camera.position.z = 24;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);
        threeRenderer = renderer;

        const globeGroup = new THREE.Group();
        scene.add(globeGroup);

        // 1. Central Translucent Sphere (Blush Rose Quartz)
        const sphereGeo = new THREE.SphereGeometry(7, 32, 32);
        const sphereMat = new THREE.MeshBasicMaterial({
          color: 0xf43f5e,
          wireframe: true,
          transparent: true,
          opacity: 0.24
        });
        const sphereMesh = new THREE.Mesh(sphereGeo, sphereMat);
        globeGroup.add(sphereMesh);

        // 2. Orbital Rings in Pink & Rose Gold
        const ringGeo1 = new THREE.TorusGeometry(8.5, 0.04, 16, 100);
        const ringMat1 = new THREE.MeshBasicMaterial({ color: 0xec4899, transparent: true, opacity: 0.55 });
        const ring1 = new THREE.Mesh(ringGeo1, ringMat1);
        ring1.rotation.x = Math.PI / 3;
        globeGroup.add(ring1);

        const ringGeo2 = new THREE.TorusGeometry(10, 0.03, 16, 100);
        const ringMat2 = new THREE.MeshBasicMaterial({ color: 0xd946ef, transparent: true, opacity: 0.4 });
        const ring2 = new THREE.Mesh(ringGeo2, ringMat2);
        ring2.rotation.y = Math.PI / 4;
        globeGroup.add(ring2);

        // 3. Employee & Department Nodes (Rose, Pearl White, Pink, Magenta)
        const nodeGroup = new THREE.Group();
        const nodeCount = 18;
        const nodeCoords = [];
        const nodeColors = [0xf43f5e, 0xec4899, 0xfb7185, 0xd946ef, 0xa855f7];

        for (let i = 0; i < nodeCount; i++) {
          const phi = Math.acos(-1 + (2 * i) / nodeCount);
          const theta = Math.sqrt(nodeCount * Math.PI) * phi;
          const r = 7.1;

          const x = r * Math.cos(theta) * Math.sin(phi);
          const y = r * Math.sin(theta) * Math.sin(phi);
          const z = r * Math.cos(phi);
          nodeCoords.push(new THREE.Vector3(x, y, z));

          const nodeGeo = new THREE.SphereGeometry(0.38, 16, 16);
          const nodeMat = new THREE.MeshBasicMaterial({
            color: nodeColors[i % nodeColors.length]
          });
          const nodeMesh = new THREE.Mesh(nodeGeo, nodeMat);
          nodeMesh.position.set(x, y, z);
          nodeGroup.add(nodeMesh);
        }
        globeGroup.add(nodeGroup);

        // 4. Glowing Interconnecting Data Streams (Rose Pink Lines)
        const lineMat = new THREE.LineBasicMaterial({ color: 0xf472b6, transparent: true, opacity: 0.35 });
        for (let i = 0; i < nodeCoords.length; i++) {
          for (let j = i + 1; j < nodeCoords.length; j++) {
            if (nodeCoords[i].distanceTo(nodeCoords[j]) < 6.5) {
              const lineGeo = new THREE.BufferGeometry().setFromPoints([nodeCoords[i], nodeCoords[j]]);
              const line = new THREE.Line(lineGeo, lineMat);
              globeGroup.add(line);
            }
          }
        }

        // 5. Sparkling Rose Dust
        const partCount = 80;
        const partGeo = new THREE.BufferGeometry();
        const partPos = [];
        for (let i = 0; i < partCount; i++) {
          partPos.push((Math.random() - 0.5) * 35);
          partPos.push((Math.random() - 0.5) * 35);
          partPos.push((Math.random() - 0.5) * 35);
        }
        partGeo.setAttribute('position', new THREE.Float32BufferAttribute(partPos, 3));
        const partMat = new THREE.PointsMaterial({ color: 0xfb7185, size: 0.14, transparent: true, opacity: 0.7 });
        const particles = new THREE.Points(partGeo, partMat);
        scene.add(particles);

        let targetRotX = 0;
        let targetRotY = 0;
        function onMouseMove(e) {
          const rect = container.getBoundingClientRect();
          const mx = ((e.clientX - rect.left) / width) * 2 - 1;
          const my = -(((e.clientY - rect.top) / height) * 2 - 1);
          targetRotY = mx * 0.45;
          targetRotX = -my * 0.45;
        }
        window.addEventListener('mousemove', onMouseMove);

        function animate() {
          threeAnimId = requestAnimationFrame(animate);

          globeGroup.rotation.y += 0.004;
          ring1.rotation.z += 0.003;
          ring2.rotation.x -= 0.002;
          particles.rotation.y += 0.001;

          globeGroup.rotation.x += (targetRotX - globeGroup.rotation.x) * 0.05;
          globeGroup.rotation.z += (targetRotY - globeGroup.rotation.z) * 0.05;

          renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
          if (!container || !renderer) return;
          const nw = container.clientWidth;
          const nh = container.clientHeight;
          if (nw && nh) {
            camera.aspect = nw / nh;
            camera.updateProjectionMatrix();
            renderer.setSize(nw, nh);
          }
        });
      }

      // ==========================================
      // SMART AI LEAVE NATURAL LANGUAGE PARSER
      // ==========================================
      function parseSmartLeaveNLP(prompt) {
        const lower = prompt.toLowerCase();
        let leaveType = 'lt_casual';
        if (lower.includes('sick') || lower.includes('doctor') || lower.includes('fever') || lower.includes('hospital') || lower.includes('dental') || lower.includes('clinic')) {
          leaveType = 'lt_sick';
        } else if (lower.includes('annual') || lower.includes('vacation') || lower.includes('holiday') || lower.includes('trip') || lower.includes('flight')) {
          leaveType = 'lt_annual';
        } else if (lower.includes('unpaid') || lower.includes('sabbatical')) {
          leaveType = 'lt_unpaid';
        }

        const today = new Date();
        let startDate = new Date();
        let endDate = new Date();

        if (lower.includes('tomorrow')) {
          startDate.setDate(today.getDate() + 1);
          endDate.setDate(today.getDate() + 1);
        } else if (lower.includes('next monday')) {
          const daysUntilMonday = (1 + 7 - today.getDay()) % 7 || 7;
          startDate.setDate(today.getDate() + daysUntilMonday);
          if (lower.includes('tuesday') || lower.includes('two days') || lower.includes('2 days')) {
            endDate = new Date(startDate);
            endDate.setDate(startDate.getDate() + 1);
          } else {
            endDate = new Date(startDate);
          }
        } else if (lower.includes('next week')) {
          const daysUntilMonday = (1 + 7 - today.getDay()) % 7 || 7;
          startDate.setDate(today.getDate() + daysUntilMonday);
          endDate = new Date(startDate);
          endDate.setDate(startDate.getDate() + 4);
        } else {
          const matches = prompt.match(/\d{4}-\d{2}-\d{2}/g);
          if (matches && matches.length >= 2) {
            startDate = new Date(matches[0]);
            endDate = new Date(matches[1]);
          } else if (matches && matches.length === 1) {
            startDate = new Date(matches[0]);
            endDate = new Date(matches[0]);
          } else {
            startDate.setDate(today.getDate() + 1);
            endDate.setDate(today.getDate() + 2);
          }
        }

        let reason = prompt;
        if (reason.length > 80) reason = reason.substring(0, 77) + '...';

        const sStr = startDate.toISOString().split('T')[0];
        const eStr = endDate.toISOString().split('T')[0];
        const days = Math.max(1, Math.round((endDate - startDate) / (1000 * 60 * 60 * 24)) + 1);

        return {
          leaveTypeId: leaveType,
          startDate: sStr,
          endDate: eStr,
          days,
          reason
        };
      }

      // ==========================================
      // PAYROLL CALCULATOR SERVICE
      // ==========================================
      function computeMonthlyPayroll(monthStr, db) {
        return db.employees.map(emp => {
          const basic = Number(emp.basicSalary) || 0;
          const hra = basic * 0.40;
          const medical = basic * 0.10;
          const gross = basic * 1.50;
          const dailyRate = gross / 30;

          const monthAttendance = db.attendance.filter(a => a.employeeId === emp.id && a.date.startsWith(monthStr));
          const absentDays = monthAttendance.filter(a => a.status === 'Absent').length;
          const halfDays = monthAttendance.filter(a => a.status === 'Half-Day').length;

          const unpaidLeaves = db.leaveRequests.filter(l => l.employeeId === emp.id && l.status === 'Approved' && l.leaveTypeId === 'lt_unpaid' && l.startDate.startsWith(monthStr));
          const unpaidDays = unpaidLeaves.reduce((sum, l) => sum + (l.days || 0), 0);

          const absentDeduction = (absentDays + unpaidDays) * dailyRate;
          const halfDayDeduction = halfDays * (0.5 * dailyRate);
          const totalDeductions = absentDeduction + halfDayDeduction;

          let taxable = Math.max(0, gross - totalDeductions);
          let tax = 0;
          if (taxable > 6000) {
            tax = (3000 * 0.10) + ((taxable - 6000) * 0.15);
          } else if (taxable > 3000) {
            tax = (taxable - 3000) * 0.10;
          }

          const netSalary = Math.max(0, gross - totalDeductions - tax);

          return {
            employeeId: emp.id,
            employeeCode: emp.code,
            name: emp.name,
            designation: emp.designation,
            departmentId: emp.departmentId,
            basicSalary: basic,
            hra,
            medical,
            grossSalary: gross,
            absentDays,
            unpaidDays,
            halfDays,
            totalDeductions,
            tax,
            netSalary,
            status: 'Draft'
          };
        });
      }

      function handleSetupNext(targetStep) {
        if (setupStep === 1) {
          setupFormData.companyName = document.getElementById('sw_companyName').value.trim() || 'HCM Organization';

          setupFormData.adminEmail = document.getElementById('sw_adminEmail').value.trim() || 'admin@hcmlite.ai';
          setupFormData.adminPassword = document.getElementById('sw_adminPassword').value || 'password123';
        } else if (setupStep === 2) {
          setupFormData.officeStart = document.getElementById('sw_officeStart').value || '09:00';
          setupFormData.officeEnd = document.getElementById('sw_officeEnd').value || '18:00';
          setupFormData.graceMinutes = Number(document.getElementById('sw_graceMinutes').value) || 15;
          setupFormData.halfDayHours = Number(document.getElementById('sw_halfDayHours').value) || 5;
          setupFormData.weekends = document.getElementById('sw_weekends').value || 'Saturday, Sunday';
        } else if (setupStep === 3) {
          setupFormData.officeLocation = document.getElementById('sw_officeLocation').value || 'HQ';
          setupFormData.officeLat = Number(document.getElementById('sw_officeLat').value) || 24.8607;
          setupFormData.officeLng = Number(document.getElementById('sw_officeLng').value) || 67.0011;
          setupFormData.radiusMeters = Number(document.getElementById('sw_radiusMeters').value) || 500;
        }
        setupStep = targetStep;
        Store.render();
      }

      function handleSetupBack(targetStep) {
        setupStep = targetStep;
        Store.render();
      }

      function handleFinalizeSetup() {
        const deptStr = document.getElementById('sw_departments').value;
        const deptNames = deptStr.split(',').map(s => s.trim()).filter(Boolean);

        const db = createEmptyDatabase();
        db.company = {
          name: setupFormData.companyName,
          established: '2026',
          settings: {
            officeStart: setupFormData.officeStart,
            officeEnd: setupFormData.officeEnd,
            graceMinutes: setupFormData.graceMinutes,
            halfDayHours: setupFormData.halfDayHours,
            weekends: setupFormData.weekends.split(',').map(s => s.trim()),
            officeLat: setupFormData.officeLat,
            officeLng: setupFormData.officeLng,
            radiusMeters: setupFormData.radiusMeters,
            locationName: setupFormData.officeLocation
          }
        };

        deptNames.forEach((dName, idx) => {
          db.departments.push({
            id: `dept_${idx + 1}`,
            name: dName,
            code: dName.substring(0, 4).toUpperCase(),
            head: 'TBD'
          });
        });

        const adminId = 'usr_admin_' + Date.now();
        const adminUser = {
          id: adminId,
          email: setupFormData.adminEmail,
          password: setupFormData.adminPassword,
          name: setupFormData.adminName,
          role: 'ADMIN',
          employeeId: null
        };
        db.users.push(adminUser);

        logAudit(db, setupFormData.adminName, 'ADMIN', 'ORGANIZATION_PROVISIONED', 'Company', `Organization ${setupFormData.companyName} created from scratch with ${deptNames.length} departments.`);

        saveDatabase(db);
        Store.db = db;
        Store.currentUser = adminUser;
        localStorage.setItem('HCM_SESSION', JSON.stringify(adminUser));
        Store.render();
      }

      function quickFillLogin(email, password) {
        loginEmail = email;
        loginPassword = password;
        const emailEl = document.getElementById('login_email');
        const passEl = document.getElementById('login_password');
        if (emailEl) emailEl.value = email;
        if (passEl) passEl.value = password;
      }

      function togglePasswordVisibility() {
        loginShowPassword = !loginShowPassword;
        const passEl = document.getElementById('login_password');
        if (passEl) passEl.type = loginShowPassword ? 'text' : 'password';
      }

      function handleLoginSubmit(e) {
        e.preventDefault();
        const email = document.getElementById('login_email').value.trim();
        const password = document.getElementById('login_password').value;

        loginLoading = true;
        loginError = '';
        Store.render();

        setTimeout(() => {
          const user = Store.db.users.find(u => u.email.toLowerCase() === email.toLowerCase());
          if (!user || user.password !== password) {
            loginLoading = false;
            loginError = 'Invalid email or password. Please verify credentials.';
            Store.render();
            return;
          }

          loginLoading = false;
          Store.currentUser = user;
          localStorage.setItem('HCM_SESSION', JSON.stringify(user));
          logAudit(Store.db, user.name, user.role, 'USER_LOGIN', 'Session', `User ${user.name} logged into ${user.role} role.`);
          Store.render();
        }, 300);
      }

      function handleLogout() {
        if (Store.currentUser) {
          logAudit(Store.db, Store.currentUser.name, Store.currentUser.role, 'USER_LOGOUT', 'Session', 'User signed out.');
        }
        Store.currentUser = null;
        localStorage.removeItem('HCM_SESSION');
        Store.activeModal = null;
        Store.render();
      }

                  </div>
                  <div class="shrink-0 px-2.5 py-1 rounded-lg bg-pink-50 border border-pink-200 text-[11px] font-mono text-rose-600 font-bold font-tabular" id="authoritative-clock">
                    ${Store.currentTimeStr || '09:00:00 AM'}

                <!-- Zone 3: Actions -->
                <div class="flex items-center gap-3 shrink-0">
                  <!-- Notifications Center Toggle -->
                  <div class="relative">
                    <button onclick="toggleNotificationsDrawer()" class="p-2 rounded-xl bg-white hover:bg-pink-50 text-slate-600 border border-pink-200 relative transition-colors shadow-sm">
                      ${Icons.bell}
                      ${Store.db.notifications.filter(n => !n.read).length > 0 ? `
                        <span class="absolute top-1 right-1 w-2 h-2 rounded-full bg-rose-500 ring-2 ring-white"></span>
                      ` : ''}
                    </button>

                    <!-- Notifications Dropdown -->
                    ${Store.notificationsOpen ? `
                      <div class="absolute right-0 mt-2 w-80 rounded-2xl glass-panel-elevated p-4 shadow-2xl border border-pink-200 z-30">
                        <div class="flex items-center justify-between mb-3 pb-2 border-b border-pink-100">
                          <span class="text-xs font-bold text-slate-900 uppercase tracking-wider">Enterprise Notifications</span>
                          <span class="text-[10px] text-rose-500 font-mono">${Store.db.notifications.length} records</span>
                        </div>
                        <div class="max-h-64 overflow-y-auto space-y-2">
                          ${Store.db.notifications.length === 0 ? `
                            <p class="text-xs text-slate-400 text-center py-4">No notifications yet.</p>
                          ` : Store.db.notifications.slice(0, 8).map(n => `
                            <div class="p-2.5 rounded-xl bg-pink-50/60 border border-pink-100 text-xs">
                              <span class="block font-bold text-slate-800">${n.title}</span>
                              <span class="block text-slate-600 mt-0.5">${n.message}</span>
                              <span class="block text-[10px] font-mono text-slate-400 mt-1">${new Date(n.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>

                          `).join('')}
                        </div>
                      </div>
                    ` : ''}
                  </div>

                  <!-- AI Assistant Shortcut -->
                  <button onclick="toggleAiAssistant()" class="px-3.5 py-1.5 rounded-xl bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-xs font-bold text-white shadow-sm transition-all flex items-center gap-1.5">
                    ${Icons.sparkles} <span>AI Assistant</span>
                  </button>

                  <!-- Demo Seed shortcut -->
                  <button onclick="seedDemoOrganization()" title="Reset / Quick Seed demo org" class="p-2 rounded-xl bg-white hover:bg-pink-50 text-rose-600 border border-pink-200 transition-colors text-xs hidden lg:block shadow-sm">
                    ${Icons.sparkles}
                  </button>
                </div>
              </header>

              <!-- Main Dynamic View Body -->
              <main class="flex-1 p-6 md:p-8 max-w-7xl w-full mx-auto">
                ${renderActiveTabView(Store.currentTab, role)}
              </main>
            </div>
          </div>
        `;
      }

      function renderNavLinks(role) {
        const active = Store.currentTab;

        if (role === 'ADMIN') {
          return `
            ${navItem('dashboard', Icons.dashboard, 'Executive Dashboard', active)}
            ${navItem('directory', Icons.users, 'Personnel & HR', active)}
            ${navItem('attendance', Icons.attendance, 'Attendance Monitor', active)}
            ${navItem('leaves', Icons.leave, 'Leave Governance', active)}
            ${navItem('payroll', Icons.payroll, 'Payroll Command', active)}
            ${navItem('analytics', Icons.analytics, 'Analytics & Reports', active)}
            ${navItem('announcements', Icons.announcements, 'Announcements', active)}
            ${navItem('audit', Icons.audit, 'Audit Trail Log', active)}
            ${navItem('settings', Icons.settings, 'Corporate Rules', active)}
          `;
        }

        if (role === 'HR') {
          return `
            ${navItem('dashboard', Icons.dashboard, 'HR Command Center', active)}
            ${navItem('directory', Icons.users, 'Employee Directory', active)}
            ${navItem('attendance', Icons.attendance, 'Daily Attendance', active)}
            ${navItem('leaves', Icons.leave, 'Leave Inquiries', active)}
            ${navItem('payroll', Icons.payroll, 'Monthly Payroll', active)}
            ${navItem('announcements', Icons.announcements, 'Announcements', active)}
            ${navItem('analytics', Icons.analytics, 'Department Stats', active)}
          `;
        }

        return `
          ${navItem('dashboard', Icons.dashboard, 'My Portal', active)}
          ${navItem('attendance', Icons.attendance, 'Clock In & History', active)}
          ${navItem('leaves', Icons.leave, 'My Leaves', active)}
          ${navItem('payroll', Icons.payroll, 'My Payslips', active)}
          ${navItem('directory', Icons.users, 'Team Directory', active)}
          ${navItem('announcements', Icons.announcements, 'Company Feed', active)}
        `;
      }

      function navItem(tabKey, iconSvg, label, activeTab) {
        const isCurrent = activeTab === tabKey;
        return `
          <button onclick="Store.setTab('${tabKey}')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition-all ${
            isCurrent
              ? 'bg-gradient-to-r from-pink-500/15 to-rose-500/10 border border-pink-300 text-rose-700 shadow-sm'
              : 'text-slate-600 hover:text-slate-900 hover:bg-pink-50/70 border border-transparent'
          }">
            <span class="${isCurrent ? 'text-pink-600' : 'text-slate-400'}">${iconSvg}</span>
            <span>${label}</span>
          </button>
        `;
      }

      function toggleNotificationsDrawer() {
        Store.notificationsOpen = !Store.notificationsOpen;
        Store.render();
      }

      function toggleAiAssistant() {
        Store.aiAssistantOpen = !Store.aiAssistantOpen;
        Store.render();
      }

      function handleGlobalSearch(e) {
        Store.searchQuery = e.target.value.toLowerCase();
        if (Store.currentTab !== 'directory') {
          Store.currentTab = 'directory';
        }
        Store.render();
      }

      // ------------------------------------------
      // 4. ACTIVE TAB VIEW ROUTER
      // ------------------------------------------
      function renderActiveTabView(tab, role) {
        switch (tab) {
          case 'dashboard':
            return role === 'ADMIN' ? renderAdminDashboard() : role === 'HR' ? renderHrDashboard() : renderEmployeeDashboard();
          case 'directory':
            return renderEmployeeDirectory();
          case 'attendance':
            return role === 'EMPLOYEE' ? renderEmployeeAttendanceView() : renderAttendanceMonitorView();
          case 'leaves':
            return role === 'EMPLOYEE' ? renderEmployeeLeavesView() : renderLeaveApprovalsInbox();
          case 'payroll':
            return role === 'EMPLOYEE' ? renderEmployeePayslipsView() : renderPayrollCommandCenter();
          case 'analytics':
            return renderAdvancedAnalyticsView();
          case 'announcements':
            return renderAnnouncementsView();
          case 'audit':
            return renderAuditLogView();
          case 'settings':
            return renderCompanySettingsView();
          default:
            return renderAdminDashboard();
        }
      }

      // ------------------------------------------
      // 5. ADMIN EXECUTIVE DASHBOARD (PINK & WHITE)
      // ------------------------------------------
      function renderAdminDashboard() {
        const db = Store.db;
        const totalStaff = db.employees.length;
        const todayStr = new Date().toISOString().split('T')[0];
        const presentToday = db.attendance.filter(a => a.date === todayStr && a.status !== 'Absent').length;
        const lateToday = db.attendance.filter(a => a.date === todayStr && a.isLate).length;
        const onLeaveToday = db.leaveRequests.filter(l => l.status === 'Approved' && l.startDate <= todayStr && l.endDate >= todayStr).length;
        const pendingLeaves = db.leaveRequests.filter(l => l.status === 'Pending').length;

        const totalPayrollGross = db.employees.reduce((acc, e) => acc + ((e.basicSalary || 0) * 1.5), 0);
        const avgSalary = totalStaff ? totalPayrollGross / totalStaff : 0;

        return `
          <div class="space-y-8">
            <!-- Header Greeting & AI Briefing Trigger -->
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 border-b border-pink-200/70 pb-6">
              <div>
                <h1 class="text-2xl md:text-3xl font-display font-bold text-slate-900 tracking-tight">Good morning, Admin.</h1>
                <p class="text-xs text-slate-500 mt-1">Here's what's happening across your organization today.</p>
              </div>
              <div class="flex items-center gap-3">
                <button onclick="generateAiDashboardSummary()" class="px-4 py-2 rounded-xl bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white text-xs font-bold shadow-md shadow-pink-500/25 transition-all flex items-center gap-2">
                  ${Icons.sparkles} Summarize Dashboard
                </button>
                <button onclick="Store.openModal('new_employee')" class="px-4 py-2 rounded-xl bg-white hover:bg-pink-50 border border-pink-300 text-rose-700 text-xs font-bold transition-colors flex items-center gap-1.5 shadow-sm">
                  ${Icons.plus} Register Employee
                </button>
              </div>
            </div>

            <div id="ai-summary-container"></div>

            <!-- Animated KPI Cards Grid in Light Pink + White -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
              ${kpiCard('Headcount', totalStaff, 'Active Staff', 'text-pink-600')}
              ${kpiCard('Present Today', presentToday, `${totalStaff ? Math.round((presentToday/totalStaff)*100) : 0}% Attendance`, 'text-emerald-600')}
              ${kpiCard('Late Today', lateToday, 'Flagged by grace engine', 'text-amber-600')}
              ${kpiCard('On Leave', onLeaveToday, `${pendingLeaves} Approvals Pending`, 'text-purple-600')}
              ${kpiCard('Monthly Payroll', formatMoney(totalPayrollGross), 'Gross Entitlement', 'text-rose-600')}
              ${kpiCard('Average Salary', formatMoney(avgSalary), 'Per Employee Gross', 'text-pink-700')}
              ${kpiCard('Attrition Rate', '0.0%', 'Zero departures', 'text-slate-600')}
              ${kpiCard('Pending Approvals', pendingLeaves, 'Awaiting HR action', pendingLeaves > 0 ? 'text-rose-600' : 'text-slate-400')}
            </div>

            <!-- Interactive Visualization Section -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <!-- Department Distribution -->
              <div class="lg:col-span-1 glass-panel rounded-3xl p-6 border border-pink-200/80">
                <div class="flex items-center justify-between mb-4">
                  <h3 class="text-sm font-bold text-slate-900 font-display">Department Distribution</h3>
                  <span class="text-xs text-rose-600 font-mono font-bold bg-pink-50 px-2 py-0.5 rounded-lg border border-pink-200">${db.departments.length} Units</span>
                </div>
                ${renderDepartmentDonut(db)}
              </div>

              <!-- Headcount & Monthly Payroll Bar Chart -->
              <div class="lg:col-span-2 glass-panel rounded-3xl p-6 border border-pink-200/80">
                <div class="flex items-center justify-between mb-4">
                  <div>
                    <h3 class="text-sm font-bold text-slate-900 font-display">Enterprise Payroll Allocation</h3>
                    <p class="text-xs text-slate-500">Departmental Gross Salary Commitment</p>
                  </div>
                  <span class="text-xs font-mono text-rose-600 font-bold bg-pink-50 px-2.5 py-1 rounded-lg border border-pink-200">${formatMoney(totalPayrollGross)}</span>
                </div>
                ${renderDepartmentPayrollBars(db)}
              </div>
            </div>

            <!-- Recent Activity & Audit Timeline Stream -->
            <div class="glass-panel rounded-3xl p-6 border border-pink-200/80">
              <div class="flex items-center justify-between mb-4 border-b border-pink-100 pb-3">
                <h3 class="text-sm font-bold text-slate-900 font-display">Recent Enterprise Audit Timeline</h3>
                <button onclick="Store.setTab('audit')" class="text-xs text-pink-600 hover:text-pink-700 font-bold">View Full Audit Trail &rarr;</button>
              </div>
              <div class="divide-y divide-pink-100">
                ${db.auditLogs.slice(0, 5).map(a => `
                  <div class="py-3 flex items-center justify-between text-xs">
                    <div class="flex items-center gap-3">
                      <span class="w-2.5 h-2.5 rounded-full bg-pink-500"></span>
                      <div>
                        <span class="font-bold text-slate-800">${a.action.replace('_', ' ')}</span>
                        <span class="text-slate-500 text-[11px] block mt-0.5">${a.details}</span>
                      </div>
                    </div>
                    <div class="text-right">
                      <span class="text-slate-700 block font-semibold">${a.actorName}</span>
                      <span class="text-[10px] font-mono text-slate-400">${new Date(a.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }

      function kpiCard(title, value, subtitle, accentColorClass = 'text-slate-900') {
        return `
          <div class="glass-panel rounded-3xl p-5 border border-pink-200/80 hover:border-pink-300 transition-all hover:shadow-md">
            <span class="text-xs text-slate-500 font-semibold uppercase tracking-wide block mb-1">${title}</span>
            <span class="text-2xl font-bold font-display ${accentColorClass} font-tabular tracking-tight block">${value}</span>
            <span class="text-[11px] text-rose-500 mt-1 block truncate font-medium">${subtitle}</span>
          </div>
        `;
      }

      function renderDepartmentDonut(db) {
        if (db.departments.length === 0) {
          return '<p class="text-xs text-slate-400 py-8 text-center">No departments created yet.</p>';
        }

        const total = db.employees.length || 1;
        const colors = ['bg-pink-500', 'bg-rose-400', 'bg-purple-500', 'bg-emerald-400', 'bg-amber-400'];

        return `
          <div class="space-y-3 pt-2">
            ${db.departments.map((d, idx) => {
              const count = db.employees.filter(e => e.departmentId === d.id).length;
              const pct = Math.round((count / total) * 100);
              const col = colors[idx % colors.length];
              return `
                <div>
                  <div class="flex items-center justify-between text-xs mb-1">
                    <span class="text-slate-800 font-semibold">${d.name}</span>
                    <span class="font-mono text-slate-500 font-medium">${count} (${pct}%)</span>
                  </div>
                  <div class="w-full h-2 rounded-full bg-pink-100/80 overflow-hidden">
                    <div class="${col} h-full rounded-full transition-all duration-500" style="width: ${pct}%"></div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      function renderDepartmentPayrollBars(db) {
        if (db.departments.length === 0) {
          return '<p class="text-xs text-slate-400 py-8 text-center">No payroll data available.</p>';
        }

        return `
          <div class="space-y-4 pt-2">
            ${db.departments.map(d => {
              const empsInDept = db.employees.filter(e => e.departmentId === d.id);
              const deptPayroll = empsInDept.reduce((acc, e) => acc + ((e.basicSalary || 0) * 1.5), 0);
              const maxPayroll = 30000;
              const pct = Math.min(100, Math.round((deptPayroll / maxPayroll) * 100));

              return `
                <div>
                  <div class="flex items-center justify-between text-xs mb-1">
                    <div class="flex items-center gap-2">
                      <span class="font-bold text-slate-800">${d.name}</span>
                      <span class="text-[10px] text-slate-500 font-mono font-medium">(${empsInDept.length} staff)</span>
                    </div>
                    <span class="font-mono text-rose-600 font-bold">${formatMoney(deptPayroll)}</span>
                  </div>
                  <div class="w-full h-3 rounded-xl bg-pink-100/70 overflow-hidden p-0.5">
                    <div class="h-full rounded-lg bg-gradient-to-r from-pink-500 to-rose-400 transition-all duration-700" style="width: ${Math.max(5, pct)}%"></div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      function generateAiDashboardSummary() {
        const container = document.getElementById('ai-summary-container');
        if (!container) return;

        const db = Store.db;
        const total = db.employees.length;
        const todayStr = new Date().toISOString().split('T')[0];
        const present = db.attendance.filter(a => a.date === todayStr && a.status !== 'Absent').length;
        const late = db.attendance.filter(a => a.date === todayStr && a.isLate).length;
        const pending = db.leaveRequests.filter(l => l.status === 'Pending').length;

        container.innerHTML = `
          <div class="p-5 rounded-3xl bg-gradient-to-r from-pink-50 via-white to-rose-50 border border-pink-300 text-xs shadow-md animate-fade-in">
            <div class="flex items-center gap-2 mb-2">
              ${Icons.sparkles}
              <span class="font-bold text-rose-700 font-display">HCM Autonomous Intelligence Briefing</span>
              <span class="text-[10px] font-mono text-slate-500 ml-auto">AI-generated</span>
            </div>
            <ul class="space-y-1.5 text-slate-700 list-disc list-inside">
              <li>Enterprise attendance rate currently standing at <strong>${total ? Math.round((present / total) * 100) : 0}%</strong> across active facilities.</li>
              <li>${late > 0 ? `Late arrival telemetry detected <strong>${late} employees</strong> exceeding the 15-minute grace tolerance.` : 'Zero late arrivals detected today; enterprise punctuality index optimal.'}</li>
              <li>Pending action: <strong>${pending} leave requests</strong> require managerial review and sign-off.</li>
              <li>Payroll obligations for the active cycle remain aligned with budget allocations.</li>
            </ul>
          </div>
        `;
      }

      // 6. HR COMMAND CENTER DASHBOARD (PINK & WHITE)

                  ${Icons.plus} Register New Hire

                  <p class="text-xs text-slate-500">Decide employee leave applications with automated balance deduction</p>
                </div>
                <span class="text-xs font-mono px-2.5 py-1 rounded-xl bg-rose-50 text-rose-700 font-bold border border-rose-200">

              </div>

              ${pending.length === 0 ? `
                <div class="text-center py-8">
                  <div class="w-12 h-12 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-600 flex items-center justify-center mx-auto mb-2">

                  <p class="text-xs text-slate-500">All employee leave inquiries have been processed.</p>

              ` : `

                      </div>
                    `;

                </div>
              `}

            <!-- Today's Attendance Stream -->
            <div class="glass-panel rounded-3xl p-6 border border-pink-200/80">
              <div class="flex items-center justify-between mb-4 border-b border-pink-100 pb-3">

      function handleAttendanceAction() {
        const user = Store.currentUser;
        if (!user.employeeId) {
          alert('No employee profile attached to this account.');
          return;
        }

        const todayStr = new Date().toISOString().split('T')[0];
        const now = new Date();
        const timeStr = now.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' });

        const existing = Store.db.attendance.find(a => a.employeeId === user.employeeId && a.date === todayStr);

        if (!existing) {
          const settings = Store.db.company?.settings || { officeStart: '09:00', graceMinutes: 15 };
          const [sh, sm] = settings.officeStart.split(':').map(Number);
          const graceEndMin = (sh * 60) + sm + Number(settings.graceMinutes || 15);
          const [curH, curM] = timeStr.split(':').map(Number);
          const curTotalMin = (curH * 60) + curM;

          const isLate = curTotalMin > graceEndMin;

          const record = {
            id: 'att_' + Date.now(),
            employeeId: user.employeeId,
            date: todayStr,
            checkIn: timeStr,
            checkOut: null,
            status: isLate ? 'Late' : 'Present',
            isLate,
            verifiedGPS: true,
            verifiedFace: true
          };

          Store.db.attendance.unshift(record);
          logAudit(Store.db, user.name, user.role, 'ATTENDANCE_CHECKIN', 'Attendance', `Check-in recorded at ${timeStr}. Status: ${record.status}`);
          saveDatabase(Store.db);
          Store.render();
        } else if (!existing.checkOut) {
          existing.checkOut = timeStr;

          const [inH, inM] = existing.checkIn.split(':').map(Number);
          const [outH, outM] = timeStr.split(':').map(Number);
          const durationHours = ((outH * 60 + outM) - (inH * 60 + inM)) / 60;

          if (durationHours < (Store.db.company?.settings?.halfDayHours || 5)) {
            existing.status = 'Half-Day';
          }

          logAudit(Store.db, user.name, user.role, 'ATTENDANCE_CHECKOUT', 'Attendance', `Check-out recorded at ${timeStr}. Total duration: ${durationHours.toFixed(1)} hrs. Status: ${existing.status}`);
          saveDatabase(Store.db);
          Store.render();
        } else {
          alert('You have already completed check-in and check-out for today.');
        }
      }

              `}
            </div>

        `;

      function handleSaveDraftPayroll(monthStr) {
        const records = computeMonthlyPayroll(monthStr, Store.db);
        let run = Store.db.payrollRuns.find(r => r.month === monthStr);
        if (!run) {
          run = {
            id: 'pr_' + Date.now(),
            month: monthStr,
            generatedAt: new Date().toISOString(),
            status: 'Draft',
            records
          };
          Store.db.payrollRuns.unshift(run);
        } else {
          run.records = records;
          run.generatedAt = new Date().toISOString();
        }

        logAudit(Store.db, Store.currentUser.name, Store.currentUser.role, 'PAYROLL_GENERATED', 'PayrollRun', `Monthly draft payroll calculated for cycle ${monthStr}. Total staff: ${records.length}`);
        saveDatabase(Store.db);
        alert(`Payroll draft for ${monthStr} saved successfully.`);
        Store.render();
      }

      function handleFinalizePayroll(monthStr) {
        if (!confirm(`Are you certain you wish to finalize and permanently LOCK payroll for ${monthStr}? Once locked, no further adjustments may be made.`)) return;

        let run = Store.db.payrollRuns.find(r => r.month === monthStr);
        const records = run ? run.records : computeMonthlyPayroll(monthStr, Store.db);

        if (!run) {
          run = {
            id: 'pr_' + Date.now(),
            month: monthStr,
            generatedAt: new Date().toISOString(),
            status: 'Finalized',
            finalizedBy: Store.currentUser.name,
            finalizedAt: new Date().toISOString(),
            records
          };
          Store.db.payrollRuns.unshift(run);
        } else {
          run.status = 'Finalized';
          run.finalizedBy = Store.currentUser.name;
          run.finalizedAt = new Date().toISOString();
        }

        logAudit(Store.db, Store.currentUser.name, 'ADMIN', 'PAYROLL_FINALIZED', 'PayrollRun', `Payroll for cycle ${monthStr} finalized and cryptographically LOCKED.`);
        addNotification(Store.db, null, `Payroll Released for ${monthStr}`, `Official salary disbursement payslips have been signed and released.`);

        saveDatabase(Store.db);
        Store.render();
      }

      function handleStandardLeaveSubmit(e) {
        e.preventDefault();
        const typeId = document.getElementById('al_type').value;
        const start = document.getElementById('al_start').value;
        const end = document.getElementById('al_end').value;
        const reason = document.getElementById('al_reason').value.trim();

        const sD = new Date(start);
        const eD = new Date(end);
        const days = Math.max(1, Math.round((eD - sD) / (1000 * 60 * 60 * 24)) + 1);

        const request = {
          id: 'lv_' + Date.now(),
          employeeId: Store.currentUser.employeeId,
          leaveTypeId: typeId,
          startDate: start,
          endDate: end,
          days,
          reason,
          status: 'Pending',
          appliedAt: new Date().toISOString(),
          managerComment: null
        };

        Store.db.leaveRequests.unshift(request);
        logAudit(Store.db, Store.currentUser.name, Store.currentUser.role, 'LEAVE_REQUESTED', 'LeaveRequest', `Standard leave requested: ${reason} (${days} days)`);
        saveDatabase(Store.db);
        Store.closeModal();
      }

      function openPayslipModal(empId, month) {
        Store.openModal('view_payslip', { empId, month });

      function renderPayslipModal(data) {
        const { empId, month } = data;
        const emp = Store.db.employees.find(e => e.id === empId);
        const dept = emp ? Store.db.departments.find(d => d.id === emp.departmentId) : null;
        const basic = emp ? emp.basicSalary : 0;
        const hra = basic * 0.40;
        const medical = basic * 0.10;
        const gross = basic * 1.50;

        const attList = Store.db.attendance.filter(a => a.employeeId === empId && a.date.startsWith(month));
        const absent = attList.filter(a => a.status === 'Absent').length;
        const halfDays = attList.filter(a => a.status === 'Half-Day').length;
        const dailyRate = gross / 30;
        const deductions = (absent * dailyRate) + (halfDays * 0.5 * dailyRate);

        let tax = 0;
        const taxable = Math.max(0, gross - deductions);
        if (taxable > 6000) tax = 300 + ((taxable - 6000) * 0.15);
        else if (taxable > 3000) tax = (taxable - 3000) * 0.10;

        const netPay = Math.max(0, gross - deductions - tax);

        return `
          <div class="w-full max-w-2xl glass-panel-elevated rounded-3xl p-6 md:p-8 border border-pink-200 text-xs max-h-[90vh] overflow-y-auto">

      function initLiveCamera() {
        const video = document.getElementById('webcam-preview');
        if (!video) return;

        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
            .then(stream => {
              Store.cameraStream = stream;
              video.srcObject = stream;
            })
            .catch(err => {
              video.outerHTML = '<div class="w-full h-full flex flex-col items-center justify-center text-slate-500 text-xs p-4 text-center"><span>Simulated High-Definition Biometric Sensor Active</span><span class="text-[10px] text-pink-600 mt-1 font-mono font-bold">Optical Node 01 Connected</span></div>';
            });
        }
      }

      function handleBiometricCheckInConfirmed() {
        Store.closeModal();
        handleAttendanceAction();
      }

      function renderNewAnnouncementModal() {
        return `
          <div class="w-full max-w-md glass-panel-elevated rounded-3xl p-6 border border-pink-200 text-xs">
            <div class="flex items-center justify-between border-b border-pink-100 pb-3 mb-4">
              <h3 class="text-base font-bold text-slate-900 font-display">Broadcast New Announcement</h3>
              <button onclick="Store.closeModal()" class="text-slate-400 hover:text-slate-800">${Icons.x}</button>
            </div>

            <form onsubmit="handleNewAnnouncementSubmit(event)" class="space-y-3">
              <div>
                <label class="block text-slate-700 font-semibold mb-1">Headline</label>
                <input type="text" id="na_title" required class="w-full px-3 py-2 rounded-xl bg-white border border-pink-200 text-slate-800 focus:outline-none focus:border-pink-500" placeholder="Q4 All-Hands Strategy Assembly" />
              </div>

              <div>
                <label class="block text-slate-700 font-semibold mb-1">Priority</label>
                <select id="na_priority" class="w-full px-3 py-2 rounded-xl bg-white border border-pink-200 text-slate-800 font-mono font-bold">
                  <option value="Normal">Normal</option>
                  <option value="Urgent">Urgent</option>
                </select>
              </div>

              <div>
                <label class="block text-slate-700 font-semibold mb-1">Content</label>
                <textarea id="na_content" rows="4" required class="w-full px-3 py-2 rounded-xl bg-white border border-pink-200 text-slate-800 focus:outline-none focus:border-pink-500" placeholder="Broadcast details..."></textarea>
              </div>

              <div class="pt-4 border-t border-pink-100 flex justify-end gap-2">
                <button type="button" onclick="Store.closeModal()" class="px-4 py-2 text-slate-500 hover:text-slate-800 font-medium">Cancel</button>
                <button type="submit" class="px-5 py-2 bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-bold rounded-xl shadow-md shadow-pink-500/25">Publish to Organization</button>
              </div>
            </form>
          </div>
        `;
      }

      function handleNewAnnouncementSubmit(e) {
        e.preventDefault();
        const title = document.getElementById('na_title').value.trim();
        const priority = document.getElementById('na_priority').value;
        const content = document.getElementById('na_content').value.trim();

        const ann = {
          id: 'ann_' + Date.now(),
          title,
          priority,
          content,
          author: Store.currentUser.name,
          date: new Date().toISOString().split('T')[0]
        };

        Store.db.announcements.unshift(ann);
        logAudit(Store.db, Store.currentUser.name, Store.currentUser.role, 'ANNOUNCEMENT_PUBLISHED', 'Announcement', `Published announcement: ${title}`);
        addNotification(Store.db, null, `New Announcement: ${title}`, content);

        saveDatabase(Store.db);
        Store.closeModal();
      }

      // ------------------------------------------
      // 17. SPATIAL FLOATING AI ORB & DRAWER (PINK & WHITE)
      // ------------------------------------------
      function renderSpatialAiOrb(root) {
        const orbBtn = document.createElement('div');
        orbBtn.className = 'fixed bottom-6 right-6 z-40';
        orbBtn.innerHTML = `
          <button onclick="toggleAiAssistant()" title="Open HCM Autonomous AI Assistant" class="w-14 h-14 rounded-full bg-gradient-to-tr from-pink-500 via-rose-500 to-purple-500 text-white flex items-center justify-center shadow-2xl shadow-pink-500/40 hover:scale-110 transition-transform animate-orb relative">
            <span class="absolute inset-0 rounded-full bg-pink-400/30 animate-ping opacity-75"></span>
            ${Icons.sparkles}
          </button>
        `;
        root.appendChild(orbBtn);

        if (!Store.aiAssistantOpen) return;

        const aiDrawer = document.createElement('div');
        aiDrawer.className = 'fixed bottom-24 right-6 w-96 max-w-[calc(100vw-3rem)] glass-panel-elevated rounded-3xl border border-pink-200 shadow-2xl z-50 flex flex-col overflow-hidden animate-slide-up';
        aiDrawer.style.height = '520px';

        aiDrawer.innerHTML = `
          <div class="p-4 border-b border-pink-100 flex items-center justify-between bg-white/90">
            <div class="flex items-center gap-2.5">
              <div class="w-7 h-7 rounded-xl bg-gradient-to-tr from-pink-500 to-rose-400 flex items-center justify-center text-white shadow-sm">
                ${Icons.sparkles}
              </div>
              <div>
                <h3 class="font-bold text-slate-900 text-xs font-display">HCM Intelligence Assistant</h3>
                <span class="text-[10px] text-pink-600 font-mono font-semibold">Role: ${Store.currentUser.role} Scope Active</span>
              </div>
            </div>
            <button onclick="toggleAiAssistant()" class="text-slate-400 hover:text-slate-800">${Icons.x}</button>
          </div>

          <div class="p-2.5 border-b border-pink-100 bg-pink-50/50 flex gap-1.5 overflow-x-auto text-[11px] whitespace-nowrap">
            <button onclick="sendQuickPrompt('Summarize our headcount and attendance today')" class="px-3 py-1 rounded-full bg-white hover:bg-pink-100 border border-pink-200 text-rose-700 font-semibold shadow-sm">
              📊 Attendance Summary
            </button>
            <button onclick="sendQuickPrompt('What are company office hours and grace period?')" class="px-3 py-1 rounded-full bg-white hover:bg-pink-100 border border-pink-200 text-rose-700 font-semibold shadow-sm">
              🕒 Office Hours
            </button>
            <button onclick="sendQuickPrompt('What is my remaining annual leave balance?')" class="px-3 py-1 rounded-full bg-white hover:bg-pink-100 border border-pink-200 text-rose-700 font-semibold shadow-sm">
              🌴 Leave Balance
            </button>
          </div>

          <div id="ai-chat-stream" class="flex-1 p-4 overflow-y-auto space-y-3 text-xs bg-gradient-to-b from-white to-pink-50/30">
            ${Store.aiMessages.map(m => `
              <div class="flex flex-col ${m.role === 'user' ? 'items-end' : 'items-start'}">
                <div class="max-w-[85%] p-3.5 rounded-2xl ${
                  m.role === 'user'
                    ? 'bg-gradient-to-r from-pink-500 to-rose-500 text-white rounded-br-none shadow-md shadow-pink-500/20'
                    : 'bg-white border border-pink-200 text-slate-800 rounded-bl-none shadow-sm'
                }">
                  <p class="whitespace-pre-line leading-relaxed font-medium">${m.text}</p>
                </div>
                <div class="flex items-center gap-1.5 mt-1 text-[10px] text-slate-500 font-mono">
                  ${m.role === 'assistant' ? '<span class="text-pink-600 font-bold">AI-generated</span> · ' : ''}
                  <span>${m.timestamp}</span>
                </div>
              </div>
            `).join('')}
          </div>

          <div class="p-3 border-t border-pink-100 bg-white/95">
            <form onsubmit="handleSendAiMessage(event)" class="flex items-center gap-2">
              <input type="text" id="ai-input-text" placeholder="Ask policy, metrics, attendance..." class="flex-1 px-3.5 py-2 rounded-xl bg-pink-50/60 border border-pink-200 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:border-pink-500" />
              <button type="submit" class="p-2 rounded-xl bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white transition-all shadow-md shadow-pink-500/25">
                ${Icons.send}
              </button>
            </form>
          </div>
        `;

        root.appendChild(aiDrawer);

        setTimeout(() => {
          const el = document.getElementById('ai-chat-stream');
          if (el) el.scrollTop = el.scrollHeight;
        }, 50);
      }

      function sendQuickPrompt(promptText) {
        const input = document.getElementById('ai-input-text');
        if (input) input.value = promptText;
        handleSendAiMessage({ preventDefault: () => {} });
      }

      function handleSendAiMessage(e) {
        if (e && e.preventDefault) e.preventDefault();
        const input = document.getElementById('ai-input-text');
        if (!input) return;

        const query = input.value.trim();
        if (!query) return;
        input.value = '';

        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        Store.aiMessages.push({
          id: 'm_' + Date.now(),
          role: 'user',
          text: query,
          timestamp: time
        });
        Store.render();

        setTimeout(() => {
          const answer = executeAiQuery(query, Store.currentUser, Store.db);
          Store.aiMessages.push({
            id: 'm_' + Date.now(),
            role: 'assistant',
            text: answer,
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          });
          Store.render();
        }, 300);
      }

      // ==========================================
      // INITIALIZATION ENTRY POINT
      // ==========================================
      window.addEventListener('DOMContentLoaded', () => {
        Store.init();
        Store.render();
      });

      Store.init();
      Store.render();
    </script>
  </body>
</html>
